name: Release addon

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # Set as a repository secret to publish on Wago; leave unset to skip.
  WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
  # Set as a repository secret to publish on CurseForge; leave unset to skip.
  CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check TOC version matches tag
        run: |
          set -euo pipefail
          TOC_VERSION=$(sed -n 's/^## Version:[[:space:]]*//p' GoblinThings/GoblinThings.toc | tr -d '\r')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TOC_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::TOC version (${TOC_VERSION}) does not match tag (${TAG_VERSION}). Bump GoblinThings.toc before tagging." >&2
            exit 1
          fi

      - name: Build addon zip
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          cp LICENSE GoblinThings/LICENSE.txt
          zip -qr "GoblinThings-${VERSION}.zip" GoblinThings -x "*.DS_Store"
          unzip -l "GoblinThings-${VERSION}.zip"

      # Commits since the previous tag, as the changelog for every store.
      - name: Write changelog
        run: |
          set -euo pipefail
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## Goblin Things ${GITHUB_REF_NAME#v}"
            echo
            if [ -n "$PREV" ]; then
              git log --no-merges --pretty='- %s' "${PREV}..${GITHUB_REF_NAME}"
            else
              git log --no-merges --pretty='- %s' "${GITHUB_REF_NAME}"
            fi
          } > CHANGELOG.md
          cat CHANGELOG.md

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: GoblinThings-${{ github.ref_name }}.zip
          body_path: CHANGELOG.md

      # Wago Addons. Runs only when the WAGO_API_TOKEN secret exists and the
      # TOC carries an X-Wago-ID, so a fork without either still releases to
      # GitHub. Goblin Things targets WoW Forever, not retail, so the supported
      # patch is read from Wago's own "forever" live-patch list (never the
      # retail one) and sent back as "supported_forever_patches" -- the
      # plural, array-shaped field the BigWigs packager (release.sh) uses for
      # a Forever upload -- so it never needs a hand edit on patch day. A tag
      # containing "beta" or "alpha" publishes at that stability.
      - name: Publish to Wago
        if: env.WAGO_API_TOKEN != ''
        run: |
          set -euo pipefail
          WAGO_ID=$(sed -n 's/^## X-Wago-ID:[[:space:]]*//p' GoblinThings/GoblinThings.toc | tr -d '\r')
          if [ -z "$WAGO_ID" ]; then
            echo "No X-Wago-ID in the TOC; skipping Wago."
            exit 0
          fi

          case "${GITHUB_REF_NAME}" in
            *alpha*) STABILITY=alpha ;;
            *beta*)  STABILITY=beta ;;
            *)       STABILITY=stable ;;
          esac

          PATCH=$(curl -sf -H "Accept: application/json" https://addons.wago.io/api/data/game \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["live_patches"]["supported_forever_patches"])')

          LABEL="${GITHUB_REF_NAME#v}" STABILITY="$STABILITY" PATCH="$PATCH" python3 - > metadata.json <<'PY'
          import json, os
          print(json.dumps({
              "label": os.environ["LABEL"],
              "stability": os.environ["STABILITY"],
              "changelog": open("CHANGELOG.md", encoding="utf-8").read(),
              "supported_forever_patches": [os.environ["PATCH"]],
          }))
          PY

          echo "Uploading to Wago project ${WAGO_ID} for forever ${PATCH} as ${STABILITY}"
          curl -sf -X POST "https://addons.wago.io/api/projects/${WAGO_ID}/version" \
            -H "Authorization: Bearer ${WAGO_API_TOKEN}" \
            -H "Accept: application/json" \
            -F "file=@GoblinThings-${GITHUB_REF_NAME}.zip" \
            -F "metadata=<metadata.json"
          echo

      # CurseForge. Runs only when the CURSEFORGE_API_TOKEN secret exists and
      # the TOC carries an X-Curse-Project-ID. The game version is looked up
      # by name from CurseForge's own list, the name being the TOC's Interface
      # read as major.minor.patch (16001 is 1.60.1), inside the version type
      # whose name says Forever, so a patch day needs only the usual Interface
      # bump. No match fails the step rather than guessing a version. A tag
      # containing "beta" or "alpha" publishes at that release type.
      - name: Publish to CurseForge
        if: env.CURSEFORGE_API_TOKEN != ''
        run: |
          set -euo pipefail
          PROJECT_ID=$(sed -n 's/^## X-Curse-Project-ID:[[:space:]]*//p' GoblinThings/GoblinThings.toc | tr -d '\r')
          if [ -z "$PROJECT_ID" ]; then
            echo "No X-Curse-Project-ID in the TOC; skipping CurseForge."
            exit 0
          fi

          case "${GITHUB_REF_NAME}" in
            *alpha*) RELEASE_TYPE=alpha ;;
            *beta*)  RELEASE_TYPE=beta ;;
            *)       RELEASE_TYPE=release ;;
          esac

          API=https://wow.curseforge.com/api
          curl -sf -H "X-Api-Token: ${CURSEFORGE_API_TOKEN}" "${API}/game/version-types" > types.json
          curl -sf -H "X-Api-Token: ${CURSEFORGE_API_TOKEN}" "${API}/game/versions" > versions.json

          INTERFACE=$(sed -n 's/^## Interface:[[:space:]]*//p' GoblinThings/GoblinThings.toc | tr -d '\r')
          LABEL="${GITHUB_REF_NAME#v}" RELEASE_TYPE="$RELEASE_TYPE" INTERFACE="$INTERFACE" python3 - > metadata.json <<'PY'
          import json, os, sys
          n = int(os.environ["INTERFACE"])
          name = f"{n // 10000}.{n // 100 % 100}.{n % 100}"
          forever = {t["id"] for t in json.load(open("types.json")) if "forever" in t["name"].lower()}
          ids = [v["id"] for v in json.load(open("versions.json"))
                 if v["name"] == name and v["gameVersionTypeID"] in forever]
          if len(ids) != 1:
              sys.exit(f"CurseForge game version {name} in a Forever type: {len(ids)} found, want 1")
          print(json.dumps({
              "displayName": "Goblin Things " + os.environ["LABEL"],
              "changelog": open("CHANGELOG.md", encoding="utf-8").read(),
              "changelogType": "markdown",
              "gameVersions": ids,
              "releaseType": os.environ["RELEASE_TYPE"],
          }))
          PY

          echo "Uploading to CurseForge project ${PROJECT_ID} as ${RELEASE_TYPE}: $(python3 -c 'import json; print(json.load(open("metadata.json"))["gameVersions"])')"
          curl -sf -X POST "${API}/projects/${PROJECT_ID}/upload-file" \
            -H "X-Api-Token: ${CURSEFORGE_API_TOKEN}" \
            -F "file=@GoblinThings-${GITHUB_REF_NAME}.zip" \
            -F "metadata=<metadata.json"
          echo
